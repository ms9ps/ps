function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));main.replaceChildren();const g=games.find(g=>location.hash==='#game-'+g.id);if(g){if(g.background){const b=el('div','game-backdrop',null,main);b.style.backgroundImage='linear-gradient(90deg,rgba(8,13,25,.93),rgba(8,13,25,.5)),linear-gradient(0deg,#080d19,transparent 55%),url('+JSON.stringify(g.background)+')';}const d=el('div','detail detail-with-background',null,main);cover(g,d,'detail-cover');const info=el('div','',null,d);el('div','eyebrow',g.category+' / '+t('Game Details'),info);el('h1','',g.title,info);const sec=el('section','game-info',null,info);el('h2','',t('Game Information'),sec);const dl=el('dl','game-info-grid',null,sec);for(const [k,v] of Object.entries(labels)){if(g[k]){const item=el('div','game-info-item',null,dl);el('dt','',t(v),item);el('dd','',g[k],item);}}el('p','description',g.description||t('No description available.'),info);const actions=el('div','actions',null,info);for(const [k,v] of [['download_url','Download Link'],['extra_url','Extra Link']]){if(/^https?:\/\//i.test(g[k]||'')){const a=link(actions,t(v)+' ↗',g[k],'btn primary');a.target='_blank';a.rel='noopener noreferrer nofollow';}}for(const [i,section] of (g.sections||[]).entries()){const block=el('section','download-section',null,info);el('h3','',t('Description')+' '+(i+2),block);el('p','description',section.description,block);const buttons=el('div','actions',null,block);for(const [k,v] of [['download_url','Download Link'],['extra_url','Extra Link']]){if(/^https?:\/\//i.test(section[k]||'')){const a=link(buttons,t(v)+' ↗',section[k],'btn primary');a.target='_blank';a.rel='noopener noreferrer nofollow';}}}link(info,t('Back to library'),'#','back');return;}
const hero=el('section','hero',null,main);el('div','eyebrow','✦ PS5 GAMES',hero);el('h1','',t('Discover the world of games'),hero);el('p','',t('Browse your PlayStation game collection with a beautiful, fast interface.'),hero);const form=el('form','search',null,hero),input=el('input','',null,form);input.placeholder=t('Search games...');input.value=q;const sel=el('select','',null,form);for(const c of ['',...new Set(games.map(g=>g.category))]){const o=el('option','',c||t('All categories'),sel);o.value=c;}sel.value=category;el('button','btn primary',t('Search')+' 🔍',form);form.onsubmit=e=>{e.preventDefault();q=input.value;category=sel.value;page=1;render();};const list=games.filter(g=>(!category||g.category===category)&&g.title.toLowerCase().includes(q.toLowerCase()));const pages=Math.max(1,Math.ceil(list.length/16));page=Math.min(page,pages);const h=el('div','section-heading',null,main);el('h2','',t('Game Library')+' · '+list.length+' '+t('games'),h);const grid=el('div','game-grid',null,main);for(const g of list.slice((page-1)*16,page*16)){const a=link(grid,'','#game-'+g.id,'game-card');cover(g,a,'cover');const i=el('div','card-info',null,a);el('h3','',g.title,i);el('span','view',t('View details')+' →',i);}if(!list.length)el('div','empty',t('No games found.'),grid);if(pages>1){const p=el('div','pagination',null,main);function btn(n,label){const a=link(p,label,'#',n===page?'active':'');a.onclick=e=>{e.preventDefault();page=n;render();window.scrollTo(0,0);};}if(page>1)btn(page-1,t('Previous'));for(let n=1;n<=pages;n++){if(n===1||n===pages||Math.abs(n-page)<=2)btn(n,String(n));else if(n===2||n===pages-1)el('span','','…',p);}if(page<pages)btn(page+1,t('Next'));}}
for(const l of ['en','ar'])document.getElementById(l).onclick=()=>{lang=l;render();};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();</script></body></html>
